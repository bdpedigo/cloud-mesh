[project]
dependencies = [
    "caveclient[cv]>=8.0.1",
    "cloud-files>=4.27.0",
    "cloud-volume>=12.12.0",
    "meshmash>=0.1.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "task-queue>=2.14.0",
    "google-cloud-pubsub>=2.37.0",
    "google-cloud-storage>=3.9.0",
    "google-cloud-monitoring>=2.20.0",
    "google-cloud-secret-manager>=2.20.0",
    "cloudpathlib",
    "tqdm>=4.65"
]
name = "cloud-mesh"
readme = "README.md"
requires-python = ">=3.12,<3.13"
version = "0.1.0"

[project.optional-dependencies]
# Needed only for `check_status.py --mode summary --update-gsheet`
# (pushes the coverage summary to a Google Sheet). Install with:
#   uv sync --extra gsheet
gsheet = [
    "gspread>=6.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.2.0",
]
